[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sisab-extrator"
version = "0.1.7"
description = "Extrator configuravel de relatorios publicos agregados do SISAB com CSV, Parquet e consolidacao historica."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Maicon Carlos", email = "143948074+maiconcarlospng@users.noreply.github.com"}]
keywords = ["sisab", "atencao primaria", "saude publica", "csv", "parquet"]
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.urls]
Homepage = "https://github.com/maiconcarlospng/sisab-extrator"
Repository = "https://github.com/maiconcarlospng/sisab-extrator"
Documentation = "https://github.com/maiconcarlospng/sisab-extrator#readme"
Issues = "https://github.com/maiconcarlospng/sisab-extrator/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sisab-extrator = "sisab_extrator.cli:main"

[tool.setuptools.packages.find]
include = ["sisab_extrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
