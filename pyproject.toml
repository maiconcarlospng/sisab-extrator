[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sisab-extrator"
version = "0.1.5"
description = "Extrator configuravel dos relatorios publicos SISAB com Parquet e consolidacao anual/historica."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Contribuidores do SISAB Extrator"}]
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.31",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sisab-extrator = "sisab_extrator.cli:main"

[tool.setuptools.packages.find]
include = ["sisab_extrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
