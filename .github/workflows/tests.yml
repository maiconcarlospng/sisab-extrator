name: Testes
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install -e '.[dev]'
      - name: Testes Python e Parquet
        run: python -m pytest -q

  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Instalar pacote R
        run: R CMD INSTALL rpkg
      - name: Conferir funcoes exportadas
        run: Rscript -e 'library(sisabextrator); stopifnot(is.function(sisab_baixar), is.function(sisab_abrir_anuais))'
      - name: Testar uso do Python isolado
        run: Rscript tests/test-r-env.R
