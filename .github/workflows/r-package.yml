name: Verificar pacote R
on:
  push:
    branches: [main]
  pull_request:
jobs:
  r-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Instalar dependência obrigatória do pacote R
        shell: bash
        run: Rscript -e 'install.packages("rlang", repos = "https://cloud.r-project.org")'
      - name: Construir pacote R
        shell: bash
        run: R CMD build .
      - name: Verificar pacote R
        shell: bash
        env:
          _R_CHECK_FORCE_SUGGESTS_: "false"
        run: R CMD check --no-manual sisabextrator_*.tar.gz
