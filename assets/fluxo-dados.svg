<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
<title id="title">Fluxo de processamento dos dados públicos</title>
<desc id="desc">Relatórios SISAB são consultados, os CSVs originais ficam preservados e os resultados são convertidos para Parquet mensal, depois anual e, por fim, para uma série histórica analisável no RStudio.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#EFFAFC"/><stop offset="1" stop-color="#EAF5F5"/></linearGradient>
  <linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#067985"/><stop offset="1" stop-color="#16B3A8"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#123B4A" flood-opacity=".10"/></filter>
  <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#169F9C"/></marker>
</defs>
<rect width="1280" height="340" rx="26" fill="url(#bg)"/>
<circle cx="1210" cy="-55" r="190" fill="#C9EEF0" opacity=".55"/>
<circle cx="82" cy="332" r="120" fill="#D7F2F3" opacity=".58"/>
<g font-family="Arial,Helvetica,sans-serif">
  <text x="44" y="46" font-size="23" font-weight="bold" fill="#0B3A52">Da consulta à série histórica</text>
  <text x="44" y="73" font-size="15" fill="#486D7E">Cada etapa tem seus arquivos guardados para facilitar a conferência.</text>
</g>
<g stroke="#169F9C" stroke-width="4" fill="none" stroke-linecap="round">
  <path d="M310 191 H343" marker-end="url(#arr)"/>
  <path d="M620 191 H653" marker-end="url(#arr)"/>
  <path d="M930 191 H963" marker-end="url(#arr)"/>
</g>
<g font-family="Arial,Helvetica,sans-serif">
  <g filter="url(#shadow)"><rect x="28" y="105" width="278" height="192" rx="19" fill="#FFFFFF"/><rect x="28" y="105" width="278" height="9" rx="4" fill="url(#head)"/></g>
  <g transform="translate(46 137)"><rect width="53" height="53" rx="14" fill="#DDF5F2"/><path d="M14 17h26M14 27h26M14 37h17" stroke="#0A8994" stroke-width="4" stroke-linecap="round"/></g>
  <text x="110" y="155" font-size="14" font-weight="bold" fill="#108B91">ETAPA 01</text>
  <text x="110" y="182" font-size="23" font-weight="bold" fill="#0A3550">Consultar</text>
  <text x="46" y="232" font-size="17" fill="#365E70">Relatórios públicos do</text><text x="46" y="256" font-size="17" fill="#365E70">SISAB e seus filtros</text>
  <g filter="url(#shadow)"><rect x="348" y="105" width="268" height="192" rx="19" fill="#FFFFFF"/><rect x="348" y="105" width="268" height="9" rx="4" fill="url(#head)"/></g>
  <g transform="translate(368 137)"><rect width="53" height="53" rx="14" fill="#DDF5F2"/><path d="M13 15h27v24H13zM18 24h17M18 31h17" fill="none" stroke="#0A8994" stroke-width="3.5" stroke-linejoin="round"/></g>
  <text x="432" y="155" font-size="14" font-weight="bold" fill="#108B91">ETAPA 02</text>
  <text x="432" y="182" font-size="23" font-weight="bold" fill="#0A3550">Baixar</text>
  <text x="368" y="232" font-size="17" fill="#365E70">CSV original +</text><text x="368" y="256" font-size="17" fill="#365E70">Parquet por mês</text>
  <g filter="url(#shadow)"><rect x="658" y="105" width="268" height="192" rx="19" fill="#FFFFFF"/><rect x="658" y="105" width="268" height="9" rx="4" fill="url(#head)"/></g>
  <g transform="translate(678 137)"><rect width="53" height="53" rx="14" fill="#DDF5F2"/><path d="M12 17h29v24H12zM19 12v10M34 12v10M13 26h27" fill="none" stroke="#0A8994" stroke-width="3.5" stroke-linecap="round"/></g>
  <text x="744" y="155" font-size="14" font-weight="bold" fill="#108B91">ETAPA 03</text>
  <text x="744" y="182" font-size="23" font-weight="bold" fill="#0A3550">Consolidar</text>
  <text x="678" y="232" font-size="17" fill="#365E70">Um conjunto Parquet</text><text x="678" y="256" font-size="17" fill="#365E70">para cada ano</text>
  <g filter="url(#shadow)"><rect x="968" y="105" width="278" height="192" rx="19" fill="#FFFFFF"/><rect x="968" y="105" width="278" height="9" rx="4" fill="url(#head)"/></g>
  <g transform="translate(988 137)"><rect width="53" height="53" rx="14" fill="#DDF5F2"/><path d="M12 38l9-12 9 6 11-16" fill="none" stroke="#0A8994" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="41" cy="16" r="4" fill="#0A8994"/></g>
  <text x="1054" y="155" font-size="14" font-weight="bold" fill="#108B91">ETAPA 04</text>
  <text x="1054" y="182" font-size="23" font-weight="bold" fill="#0A3550">Analisar</text>
  <text x="988" y="232" font-size="17" fill="#365E70">Série histórica</text><text x="988" y="256" font-size="17" fill="#365E70">aberta no RStudio</text>
</g>
</svg>